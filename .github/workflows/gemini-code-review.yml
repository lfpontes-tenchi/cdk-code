name: Gemini Code Review

on:
  pull_request:

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: ./ .github/actions/gemini-code-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
